spring:
  application:
    name: devices-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devices_api}
    username: ${DB_USERNAME:devices_user}
    password: ${DB_PASSWORD:salmanisgreat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
